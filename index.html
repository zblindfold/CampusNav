<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CampusNav</title>
<link rel="stylesheet" href="indexstyle.css">
</head>

<body>

<header>
    <div class="logo">CampusNav</div>
</header>

<main>

<h1>Indoor Campus Navigation</h1>

<p class="tag">
"Navigate your campus effortlessly with smart augmented-reality indoor guidance."
</p>

<p class="select">Select Your Destination</p>

<div class="grid">

<button onclick="selectDestination('csdepartment')">CS Department</button>
<button onclick="selectDestination('hod')">HOD Room</button>
<button onclick="selectDestination('cs2')">CS2 Room</button>
<button onclick="selectDestination('cs3')">CS3 Room</button>
<button onclick="selectDestination('cs4')">CS4 Room</button>
<button onclick="selectDestination('canteen')">Canteen</button>
<button onclick="selectDestination('workshop')">Electrical Workshop</button>
<button onclick="selectDestination('washmale')">Washroom Male</button>
<button class="wide" onclick="selectDestination('washfemale')">Washroom Female</button>

</div>

<button class="start" onclick="startAR()">Start AR Navigation</button>

</main>

<script>

let selectedDestination = "";

// When a destination is clicked
function selectDestination(dest) {
    selectedDestination = dest;
}

// When Start AR is clicked
function startAR() {

    if (selectedDestination === "") {
        alert("Please select a destination first.");
        return;
    }

    // Open Unity APK using deep link
    window.location.href = "campusnav://destination=" + selectedDestination;
}

</script>

</body>
</html>
